name: Build et déploiement des données ODD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-data"
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt data
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install open-sdg sdg-build pyyaml pandas

      - name: Build des données Open SDG
        run: |
          python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-data:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-data
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Après déploiement des données, déclencher le rebuild du site
  notify-site:
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - name: Notifier le dépôt site de mettre à jour
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_REPO_TOKEN }}
          repository: ndaosaer/odd-senegal-site
          event-type: data-update
