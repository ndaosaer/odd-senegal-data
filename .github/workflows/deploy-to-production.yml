name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build data
        run: |
          python scripts/build_data.py

      - name: Deploy data to GitHub Pages (odd-senegal-data)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: ndaosaer/odd-senegal-data
          token: ${{ secrets.TOKEN }}
          branch: gh-pages
          folder: _site
          clean: true

      - name: Waiting for data deployment
        run: sleep 60

      - name: Trigger site rebuild (odd-senegal-site)
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ndaosaer/odd-senegal-site/actions/workflows/deploy-to-production.yml/dispatches \
            -d '{"ref":"main"}'
