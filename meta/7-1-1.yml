# Métadonnées — ODD 7 : Énergie propre et abordable
# Généré automatiquement — Mémoire ANSD/DMCI 2025

indicator_name: >-
  Score composite normalisé de l'ODD 7 — Énergie propre et abordable

indicator_number: '7.1.1'

national_indicator_description: >-
  Cet indicateur représente le score composite normalisé de l'ODD 7
  calculé à partir de 11 indicateurs internationaux disponibles
  pour le Sénégal. Le score est normalisé dans l'intervalle [0, 1] où 1
  correspond à la meilleure performance observée sur la période 2000-2024.
  La méthode de normalisation appliquée est la méthode min-max (OCDE, 2008).

national_geographical_coverage: Sénégal (données nationales)

computation_units: Score normalisé [0 – 1]

computation_calculations: >-
  Score composite calculé par moyenne arithmétique non pondérée des scores
  min-max normalisés des indicateurs ODD 7 disponibles pour le Sénégal.
  Formule : C(j,t) = (1/n_j) × Σ S(i,t) pour tout i appartenant à l'ODD 7.
  Pour les indicateurs à sens négatif (valeur haute = mauvaise performance),
  la formule d'inversion est appliquée : S(i,t) = [max X(i) − X(i,t)] / [max X(i) − min X(i)].

